  <div class="festivo-loader" aria-hidden="true"><span></span></div>
</div>
<style>
.festivo-intro{position:fixed;inset:0;z-index:1000000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050408;color:#fff;opacity:1;visibility:visible;transition:opacity .48s ease,visibility .48s ease;padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom)}
.festivo-intro.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.festivo-intro-brand{text-align:center;transform:translateY(-3vh);font-family:"Comfortaa","Trebuchet MS",ui-rounded,sans-serif;font-weight:900;letter-spacing:.075em}
.festivo-word{font-size:clamp(38px,10vw,66px);line-height:1.12;color:#fff;text-shadow:0 0 5px #fff,0 0 13px #b88aff,0 0 28px #8a45ff,0 0 52px #7134dc}
.festivo-present{margin-top:9px;font-size:clamp(17px,4.5vw,25px);font-weight:700;letter-spacing:.24em;text-transform:lowercase;color:#fff;text-shadow:0 0 7px #d9c2ff,0 0 20px #914cff,0 0 35px #7134dc}
.festivo-loader{position:absolute;left:10%;right:10%;bottom:calc(12vh + env(safe-area-inset-bottom));height:9px;overflow:hidden;border:1px solid #b98cff;background:#21172f;border-radius:20px;box-shadow:0 0 12px #9b5cff,0 0 28px #7134dc99,0 0 48px #7134dc55}
.festivo-loader span{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7540d8,#c6a1ff,#fff);transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px #a66cff,0 0 24px #8a45ff}.festivo-intro.is-loading .festivo-loader span{animation:festivo-loading 2s linear forwards}
@keyframes festivo-loading{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.festivo-intro,.festivo-loader span{transition:none;animation-duration:.3s}}
</style>
<script>
(function(){var started=false;function startIntro(){if(started)return;started=true;var intro=document.getElementById("festivo-intro");if(!intro)return;intro.classList.add("is-loading");setTimeout(function(){if(typeof window.moguStartWelcome==="function")window.moguStartWelcome();setTimeout(function(){intro.classList.add("is-leaving");setTimeout(function(){intro.remove()},550)},30)},2000);setTimeout(function(){if(intro.isConnected){intro.classList.add("is-leaving");setTimeout(function(){if(intro.isConnected)intro.remove()},550)}},6000)}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",startIntro,{once:true})}else{startIntro()}})();
</script>
