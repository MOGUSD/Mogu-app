name: Build МОГУ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile build tools
        run: npm install

      - name: Prepare web app bundle
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp -R assets www/assets

      - name: Create high-resolution launcher artwork from original МОГУ logo
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('assets/mogu-original.webp')
              .resize(1024, 1024, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/icon-only.png');
            await sharp('assets/mogu-original.webp')
              .resize(2732, 2732, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/splash.png');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Generate Android launcher icons from original МОГУ logo
        run: |
          test -s assets/icon-only.png
          test -s assets/splash.png
          npx capacitor-assets generate --android

      - name: Sync web application into Android
        run: npx cap sync android

      # Capacitor sync may restore its default artwork. Replace the adaptive foreground PNGs
      # themselves with the original МОГУ artwork AFTER sync, then point both adaptive icons at them.
      - name: Force Android adaptive icons to use the original МОГУ artwork
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const sizes = { mdpi: 108, hdpi: 162, xhdpi: 216, xxhdpi: 324, xxxhdpi: 432 };
            for (const [density, size] of Object.entries(sizes)) {
              const dirs = [
                `android/app/src/main/res/mipmap-${density}-v4`,
                `android/app/src/main/res/mipmap-${density}`
              ];
              for (const dir of dirs) {
                if (!fs.existsSync(dir)) continue;
                const output = path.join(dir, 'ic_launcher_foreground.png');
                await sharp('assets/mogu-original.webp')
                  .resize(Math.round(size * 0.66), Math.round(size * 0.66), { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 1 } })
                  .extend({ top: Math.round(size * 0.17), bottom: size - Math.round(size * 0.17) - Math.round(size * 0.66), left: Math.round(size * 0.17), right: size - Math.round(size * 0.17) - Math.round(size * 0.66), background: { r: 255, g: 255, b: 255, alpha: 1 } })
                  .png()
                  .toFile(output);
              }
            }
            for (const icon of ['ic_launcher', 'ic_launcher_round']) {
              fs.writeFileSync(`android/app/src/main/res/mipmap-anydpi-v26/${icon}.xml`, `<?xml version="1.0" encoding="utf-8"?>\\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\\n    <background android:drawable="@android:color/white" />\\n    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\\n</adaptive-icon>\\n`);
            }
            const foregrounds = Object.keys(sizes).flatMap(d => [`android/app/src/main/res/mipmap-${d}-v4/ic_launcher_foreground.png`, `android/app/src/main/res/mipmap-${d}/ic_launcher_foreground.png`]).filter(fs.existsSync);
            if (!foregrounds.length) throw new Error('No adaptive launcher foreground PNGs were generated');
            console.log('Replaced adaptive foreground assets:', foregrounds.join(', '));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install and launch МОГУ in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.mogu.app 1
            sleep 10
            adb shell pidof com.mogu.app
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mogu-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
