name: Build МОГУ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile build tools
        run: npm install

      - name: Prepare web app bundle
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp -R assets www/assets

      - name: Create high-resolution launcher artwork from original МОГУ logo
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('assets/mogu-original.webp')
              .resize(1024, 1024, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/icon-only.png');
            await sharp('assets/mogu-original.webp')
              .resize(2732, 2732, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/splash.png');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Generate Android launcher icons from original МОГУ logo
        run: |
          test -s assets/icon-only.png
          test -s assets/splash.png
          npx capacitor-assets generate --android

      - name: Sync web application into Android
        run: npx cap sync android

      # Capacitor sync can replace launcher resources, so enforce adaptive icons AFTER sync.
      - name: Force Android adaptive icons to use the original МОГУ artwork
        run: |
          for icon in ic_launcher ic_launcher_round; do
            cat > "android/app/src/main/res/mipmap-anydpi-v26/${icon}.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          done
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install and launch МОГУ in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.mogu.app 1
            sleep 10
            adb shell pidof com.mogu.app
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mogu-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
