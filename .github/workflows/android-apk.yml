name: Build МОГУ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile build tools
        run: npm install

      - name: Prepare web app bundle
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp -R assets www/assets

      - name: Create high-resolution launcher artwork from original МОГУ logo
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('assets/mogu-icon.svg')
              .resize(1024, 1024, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/icon-only.png');
            await sharp('assets/mogu-icon.svg')
              .resize(2732, 2732, { fit: 'contain', background: '#fff8e8' })
              .png()
              .toFile('assets/splash.png');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync web application into Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mogu-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
